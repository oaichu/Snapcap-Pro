<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapCap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup" id="mainView">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
        <span class="logo-text">SnapCap</span>
      </div>
      <button class="icon-btn" id="openEditorHome" title="Open Editor">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </button>
    </header>

    <!-- Screenshot Section -->
    <section class="section">
      <h2 class="section-title">Screenshot</h2>
      <div class="actions">
        <button class="action-btn" id="btnCaptureVisible">
          <div class="action-icon visible">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/>
            </svg>
          </div>
          <div class="action-text">
            <span class="action-name">Visible Area</span>
            <span class="action-desc">Capture current view</span>
          </div>
        </button>
        
        <button class="action-btn" id="btnCaptureSelected">
          <div class="action-icon select">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
            </svg>
          </div>
          <div class="action-text">
            <span class="action-name">Select Area</span>
            <span class="action-desc">Drag to select region</span>
          </div>
        </button>
        
        <button class="action-btn" id="btnCaptureFull">
          <div class="action-icon full">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>
            </svg>
          </div>
          <div class="action-text">
            <span class="action-name">Full Page</span>
            <span class="action-desc">Auto-scroll capture</span>
          </div>
        </button>
      </div>
    </section>

    <!-- Recording Section -->
    <section class="section">
      <h2 class="section-title">Screen Recording <span class="badge">30s max</span></h2>
      <div class="recorder">
        <div class="recorder-controls">
          <label class="toggle">
            <input type="checkbox" id="toggleMic">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-label">Mic</span>
          </label>
          <div class="select-wrapper">
            <select id="recordLimit" class="select">
              <option value="30">30s</option>
              <option value="15">15s</option>
              <option value="10">10s</option>
            </select>
          </div>
        </div>
        <button class="record-btn" id="btnStartRecord">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
          Start Recording
        </button>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="delay-control">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>Delay</span>
        <select id="delaySelect" class="select-small">
          <option value="0">Off</option>
          <option value="3">3s</option>
          <option value="5">5s</option>
        </select>
      </div>
      <button class="text-btn" id="viewHistoryBtn">View Captures</button>
    </footer>

    <div class="status-bar" id="captureStatus" style="display:none"></div>
  </div>

  <!-- Preview View (shown after capture) -->
  <div class="popup preview-view" id="previewView" style="display: none;">
    <header class="header">
      <button class="icon-btn" id="backBtn" title="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <span class="logo-text">Captured!</span>
      <button class="icon-btn" id="editBtn" title="Edit in Editor">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </button>
    </header>

    <div class="preview-content">
      <div class="preview-image-container">
        <img id="previewImage" alt="Captured">
      </div>
      <div class="preview-actions">
        <button class="quick-btn" id="quickDownload" title="Download">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Download</span>
        </button>
        <button class="quick-btn" id="quickCopy" title="Copy to Clipboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span>Copy</span>
        </button>
        <button class="quick-btn" id="quickShare" title="Share">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
          <span>Share</span>
        </button>
      </div>
    </div>

    <div class="status-bar" id="statusBar"></div>
  </div>

  <!-- Video Preview View -->
  <div class="popup preview-view" id="videoPreviewView" style="display: none;">
    <header class="header">
      <button class="icon-btn" id="backBtnVideo" title="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <span class="logo-text">Recorded!</span>
      <button class="icon-btn" id="editBtnVideo" title="Edit in Editor">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </button>
    </header>

    <div class="preview-content">
      <div class="preview-video-container">
        <video id="previewVideo" controls></video>
      </div>
      <div class="preview-actions">
        <button class="quick-btn" id="quickDownloadVideo" title="Download">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Download</span>
        </button>
        <button class="quick-btn" id="quickShareVideo" title="Share">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
          <span>Share</span>
        </button>
      </div>
    </div>

    <div class="status-bar" id="statusBarVideo"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>

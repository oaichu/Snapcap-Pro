name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Validate version matches manifest
        run: |
          MANIFEST_VERSION=$(node -e "console.log(require('./manifest.json').version)")
          TAG_VERSION="${{ steps.get_version.outputs.VERSION }}"

          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: manifest.json ($MANIFEST_VERSION) vs tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # The source tree is NOT shippable: offscreen.js is an ES module that must
      # be bundled. Always package the built dist/ output.
      - name: Build extension bundle
        run: npm run build

      - name: Create extension package
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          cd dist
          zip -r "../snapcap-extension-v$VERSION.zip" . -x "*.DS_Store" "*.zip"
          cd ..
          mv "snapcap-extension-v$VERSION.zip" dist/

      - name: Generate changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          git log --oneline --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo HEAD~10)..HEAD >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.zip
          body: |
            ## SnapCap Extension v${{ steps.get_version.outputs.VERSION }}

            ### Changes
            ${{ steps.changelog.outputs.CHANGELOG }}

            ### Installation
            1. Download the zip file
            2. Extract to a folder
            3. Go to `chrome://extensions`
            4. Enable Developer Mode
            5. Click "Load unpacked" and select the extracted folder

            ### Verification
            - Manifest Version: ${{ steps.get_version.outputs.VERSION }}
            - Build Date: ${{ github.event.head_commit.timestamp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build-and-release
    if: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run tests
        working-directory: ./backend
        run: node --test test/unit/*.test.js test/integration/*.test.js

      - name: Deploy to Firebase
        run: |
          echo "Deploy to Firebase would happen here"
          echo "Requires FIREBASE_TOKEN secret to be set"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" role="img" aria-label="SnapCap Pro Workflow Pipeline">
  <defs>
    <style>
      @keyframes flowDash {
        to { stroke-dashoffset: -28; }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(0, 113, 227, 0.2)); }
        50% { filter: drop-shadow(0 0 14px rgba(175, 82, 222, 0.7)); }
      }
      .flow-arrow { stroke-dasharray: 8 6; animation: flowDash 1.2s linear infinite; stroke-linecap: round; }
      .card { transform-origin: center; }
      .card-1 { animation: floatCard 4s ease-in-out infinite 0s, pulseGlow 4s ease-in-out infinite 0s; }
      .card-2 { animation: floatCard 4s ease-in-out infinite 0.6s, pulseGlow 4s ease-in-out infinite 0.6s; }
      .card-3 { animation: floatCard 4s ease-in-out infinite 1.2s, pulseGlow 4s ease-in-out infinite 1.2s; }
      .card-4 { animation: floatCard 4s ease-in-out infinite 1.8s, pulseGlow 4s ease-in-out infinite 1.8s; }
    </style>
    
    <linearGradient id="bgBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161824"/>
      <stop offset="100%" stop-color="#0E1017"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="220" rx="20" fill="#0B0C10" stroke="#1F2430" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif" text-anchor="middle">
    <!-- Card 1: Capture -->
    <g class="card card-1">
      <rect x="25" y="45" width="230" height="130" rx="16" fill="url(#bgBox)" stroke="#00D2FF" stroke-width="2"/>
      <circle cx="65" cy="78" r="18" fill="rgba(0,210,255,0.15)"/>
      <text x="65" y="84" font-size="18">📸</text>
      <text x="145" y="80" fill="#00D2FF" font-size="16" font-weight="700">1. CAPTURE</text>
      <text x="140" y="112" fill="#E4E4E7" font-size="12" font-weight="500">Visible Window</text>
      <text x="140" y="132" fill="#A1A1AA" font-size="11">Interactive Crop Region</text>
      <text x="140" y="152" fill="#A1A1AA" font-size="11">Full-Page Auto-Stitching</text>
    </g>

    <!-- Card 2: Record -->
    <g class="card card-2">
      <rect x="295" y="45" width="230" height="130" rx="16" fill="url(#bgBox)" stroke="#FF3B30" stroke-width="2"/>
      <circle cx="335" cy="78" r="18" fill="rgba(255,59,48,0.15)"/>
      <text x="335" y="84" font-size="18">🎥</text>
      <text x="415" y="80" fill="#FF3B30" font-size="16" font-weight="700">2. 30s RECORD</text>
      <text x="410" y="112" fill="#E4E4E7" font-size="12" font-weight="500">Fast 30s Clip Limit</text>
      <text x="410" y="132" fill="#A1A1AA" font-size="11">Tab + Mic Audio Stream</text>
      <text x="410" y="152" fill="#A1A1AA" font-size="11">Live In-Page Countdown</text>
    </g>

    <!-- Card 3: Studio Annotate -->
    <g class="card card-3">
      <rect x="565" y="45" width="240" height="130" rx="16" fill="url(#bgBox)" stroke="#AF52DE" stroke-width="2"/>
      <circle cx="605" cy="78" r="18" fill="rgba(175,82,222,0.15)"/>
      <text x="605" y="84" font-size="18">🎨</text>
      <text x="690" y="80" fill="#AF52DE" font-size="16" font-weight="700">3. STUDIO SUITE</text>
      <text x="685" y="112" fill="#E4E4E7" font-size="12" font-weight="500">Pencil, Shapes &amp; Arrows</text>
      <text x="685" y="132" fill="#A1A1AA" font-size="11">🌫️ Pixelate / Blur Redact</text>
      <text x="685" y="152" fill="#A1A1AA" font-size="11">Video Frame Extraction</text>
    </g>

    <!-- Card 4: Instant Export -->
    <g class="card card-4">
      <rect x="845" y="45" width="230" height="130" rx="16" fill="url(#bgBox)" stroke="#34C759" stroke-width="2"/>
      <circle cx="885" cy="78" r="18" fill="rgba(52,199,89,0.15)"/>
      <text x="885" y="84" font-size="18">⚡</text>
      <text x="965" y="80" fill="#34C759" font-size="16" font-weight="700">4. ZERO-COPY</text>
      <text x="960" y="112" fill="#E4E4E7" font-size="12" font-weight="500">1-Click Copy to Clipboard</text>
      <text x="960" y="132" fill="#A1A1AA" font-size="11">Lossless PNG / WebM</text>
      <text x="960" y="152" fill="#A1A1AA" font-size="11">Offline-First &amp; Private</text>
    </g>

    <!-- Connector Arrows -->
    <path class="flow-arrow" d="M 255 110 H 295" stroke="#00D2FF" stroke-width="3"/>
    <path class="flow-arrow" d="M 525 110 H 565" stroke="#FF3B30" stroke-width="3"/>
    <path class="flow-arrow" d="M 805 110 H 845" stroke="#AF52DE" stroke-width="3"/>
  </g>
</svg>

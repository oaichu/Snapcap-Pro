<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="SnapCap Pro Animated Architecture Map">
  <defs>
    <!-- Studio Dark Canvas Background -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="50%" stop-color="#0C101D"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>

    <!-- Glass Cards Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Border Glows -->
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#B800FF"/>
    </linearGradient>

    <linearGradient id="pinkBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>

    <linearGradient id="greenBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFB2"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="orbPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF007A" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7000FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
      .font-sans { font-family: -apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif; }

      /* Laser Flow Animations */
      @keyframes dashFlow {
        from { stroke-dashoffset: 60; }
        to { stroke-dashoffset: 0; }
      }

      @keyframes pulseLight {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.9; }
      }

      @keyframes floatSlow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      @keyframes signalBeacon {
        0% { r: 3; opacity: 1; }
        100% { r: 11; opacity: 0; }
      }

      .wire-cyan {
        stroke: #00F5FF;
        stroke-dasharray: 6 6;
        animation: dashFlow 1.8s linear infinite;
      }

      .wire-pink {
        stroke: #FF007A;
        stroke-dasharray: 6 6;
        animation: dashFlow 1.8s linear infinite;
      }

      .wire-purple {
        stroke: #9B51E0;
        stroke-dasharray: 6 6;
        animation: dashFlow 2.2s linear infinite;
      }

      .wire-green {
        stroke: #00FFB2;
        stroke-dasharray: 6 6;
        animation: dashFlow 1.6s linear infinite;
      }

      .pulse-glow { animation: pulseLight 2.5s ease-in-out infinite; }
      .float-card { animation: floatSlow 5s ease-in-out infinite; }
      .beacon-ring { animation: signalBeacon 1.8s cubic-bezier(0, 0.2, 0.8, 1) infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Backdrop Container -->
  <rect width="960" height="560" rx="18" fill="url(#archBg)" stroke="#1F2438" stroke-width="1.5"/>

  <!-- Tech Ambient Grids -->
  <g stroke="rgba(255, 255, 255, 0.025)" stroke-width="1">
    <line x1="0" y1="140" x2="960" y2="140"/>
    <line x1="0" y1="280" x2="960" y2="280"/>
    <line x1="0" y1="420" x2="960" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="560"/>
    <line x1="480" y1="0" x2="480" y2="560"/>
    <line x1="720" y1="0" x2="720" y2="560"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="220" fill="url(#orbCyan)"/>
  <circle cx="500" cy="300" r="250" fill="url(#orbPurple)"/>
  <circle cx="800" cy="220" r="200" fill="url(#orbPink)"/>

  <!-- Top Title Header Bar -->
  <g transform="translate(32, 28)">
    <!-- Traffic lights -->
    <circle cx="0" cy="6" r="5" fill="#FF5F56"/>
    <circle cx="16" cy="6" r="5" fill="#FFBD2E"/>
    <circle cx="32" cy="6" r="5" fill="#27C93F"/>

    <!-- Architecture Title Badge -->
    <rect x="58" y="-6" width="370" height="24" rx="6" fill="rgba(0, 245, 255, 0.08)" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1"/>
    <text x="70" y="10" fill="#00F5FF" class="font-mono" font-size="11" font-weight="700" letter-spacing="1">MANIFEST V3 REACTIVE ARCHITECTURE</text>
    <text x="325" y="10" fill="#71717A" class="font-mono" font-size="11">· 60FPS BUS</text>

    <!-- Right Live System Status -->
    <g transform="translate(740, 4)">
      <circle cx="0" cy="0" r="4" fill="#00FFB2"/>
      <circle cx="0" cy="0" r="4" fill="#00FFB2" class="beacon-ring" stroke="#00FFB2" stroke-width="1.5"/>
      <text x="12" y="4" fill="#00FFB2" class="font-sans" font-size="12" font-weight="700">100% OFFLINE BUS</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- ACTIVE DATA LASER HIGHWAYS (CONNECTOR PATHS) -->
  <!-- ========================================================================= -->

  <!-- 1. POPUP -> SERVICE WORKER (Trigger Wire) -->
  <path d="M 235 155 L 360 155 L 360 260 L 410 260" fill="none" stroke="rgba(0, 245, 255, 0.15)" stroke-width="2.5"/>
  <path d="M 235 155 L 360 155 L 360 260 L 410 260" fill="none" class="wire-cyan" stroke-width="2.5" filter="url(#laserGlow)"/>

  <!-- 2. CONTENT SCRIPT -> SERVICE WORKER (Coordinate & Tile Stream) -->
  <path d="M 235 395 L 360 395 L 360 290 L 410 290" fill="none" stroke="rgba(0, 245, 255, 0.15)" stroke-width="2.5"/>
  <path d="M 235 395 L 360 395 L 360 290 L 410 290" fill="none" class="wire-cyan" stroke-width="2.5" filter="url(#laserGlow)"/>

  <!-- 3. SERVICE WORKER -> OFFSCREEN RECORDER (Media Lifecycle Dispatch) -->
  <path d="M 570 250 L 630 250 L 630 155 L 725 155" fill="none" stroke="rgba(255, 0, 122, 0.15)" stroke-width="2.5"/>
  <path d="M 570 250 L 630 250 L 630 155 L 725 155" fill="none" class="wire-pink" stroke-width="2.5" filter="url(#laserGlow)"/>

  <!-- 4. OFFSCREEN RECORDER -> INDEXEDDB (4K WebM Chunk Stream) -->
  <path d="M 825 215 L 825 285 L 570 410" fill="none" stroke="rgba(255, 0, 122, 0.15)" stroke-width="2.5"/>
  <path d="M 825 215 L 825 285 L 570 410" fill="none" class="wire-pink" stroke-width="2.5" filter="url(#laserGlow)"/>

  <!-- 5. SERVICE WORKER -> INDEXEDDB (Stitched Bitmap Writer) -->
  <path d="M 490 335 L 490 375" fill="none" stroke="rgba(155, 81, 224, 0.2)" stroke-width="2.5"/>
  <path d="M 490 335 L 490 375" fill="none" class="wire-purple" stroke-width="2.5" filter="url(#laserGlow)"/>

  <!-- 6. INDEXEDDB -> STUDIO CANVAS (Instant Zero-Copy Texture Hydration) -->
  <path d="M 410 445 L 320 445 L 320 490 L 725 490 L 725 435" fill="none" stroke="rgba(0, 255, 178, 0.15)" stroke-width="2.5"/>
  <path d="M 410 445 L 320 445 L 320 490 L 725 490 L 725 435" fill="none" class="wire-green" stroke-width="2.5" filter="url(#laserGlow)"/>

  <!-- Label Tags on Wires -->
  <g class="font-mono" font-size="9" font-weight="700">
    <!-- Trigger Wire Label -->
    <rect x="260" y="143" width="86" height="18" rx="4" fill="#0C101D" stroke="rgba(0, 245, 255, 0.4)" stroke-width="1"/>
    <text x="266" y="155" fill="#00F5FF">⚡ TRIGGER BUS</text>

    <!-- Crop Wire Label -->
    <rect x="260" y="383" width="86" height="18" rx="4" fill="#0C101D" stroke="rgba(0, 245, 255, 0.4)" stroke-width="1"/>
    <text x="266" y="395" fill="#00F5FF">📦 TILES &amp; CROP</text>

    <!-- Stream Wire Label -->
    <rect x="610" y="143" width="102" height="18" rx="4" fill="#0C101D" stroke="rgba(255, 0, 122, 0.4)" stroke-width="1"/>
    <text x="616" y="155" fill="#FF007A">🎥 4K DISPATCH</text>

    <!-- Zero-Copy Wire Label -->
    <rect x="475" y="480" width="112" height="18" rx="4" fill="#0C101D" stroke="rgba(0, 255, 178, 0.4)" stroke-width="1"/>
    <text x="481" y="492" fill="#00FFB2">⚡ ZERO-COPY LOAD</text>
  </g>


  <!-- ========================================================================= -->
  <!-- ARCHITECTURE NODES (CARDS) -->
  <!-- ========================================================================= -->

  <!-- NODE 1: POPUP CONTROLLER (Top-Left) -->
  <g transform="translate(35, 95)" class="float-card">
    <rect width="200" height="120" rx="14" fill="url(#cardGrad)" stroke="url(#cyanBorder)" stroke-width="1.4" filter="url(#softGlow)"/>
    <rect width="200" height="120" rx="14" fill="#0B0E1B" opacity="0.85"/>
    
    <!-- Header -->
    <rect x="12" y="12" width="24" height="24" rx="6" fill="rgba(0, 245, 255, 0.15)"/>
    <path d="M 20 24 L 28 16 M 24 16 L 28 16 L 28 20" stroke="#00F5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="44" y="24" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="800">Popup Dashboard</text>
    <text x="44" y="35" fill="rgba(255, 255, 255, 0.45)" class="font-mono" font-size="9.5">popup.html / popup.js</text>

    <!-- Details -->
    <g class="font-sans" font-size="10.5" fill="#A1A1AA" transform="translate(14, 56)">
      <text y="0">• Glassmorphism UI trigger</text>
      <text y="16">• 3s/5s countdown timer</text>
      <text y="32">• Desktop stream selector</text>
      <text y="48">• Session state mirror</text>
    </g>
    
    <!-- Status Dot -->
    <circle cx="184" cy="20" r="4" fill="#00F5FF" class="pulse-glow"/>
  </g>

  <!-- NODE 2: CONTENT SCRIPT OVERLAY (Bottom-Left) -->
  <g transform="translate(35, 335)">
    <rect width="200" height="120" rx="14" fill="url(#cardGrad)" stroke="url(#cyanBorder)" stroke-width="1.4" filter="url(#softGlow)"/>
    <rect width="200" height="120" rx="14" fill="#0B0E1B" opacity="0.85"/>
    
    <!-- Header -->
    <rect x="12" y="12" width="24" height="24" rx="6" fill="rgba(0, 245, 255, 0.15)"/>
    <rect x="18" y="18" width="12" height="12" rx="2" stroke="#00F5FF" stroke-width="1.8" fill="none"/>
    <text x="44" y="24" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="800">In-Page Overlay</text>
    <text x="44" y="35" fill="rgba(255, 255, 255, 0.45)" class="font-mono" font-size="9.5">content_script.js</text>

    <!-- Details -->
    <g class="font-sans" font-size="10.5" fill="#A1A1AA" transform="translate(14, 56)">
      <text y="0">• Interactive crop reticle</text>
      <text y="16">• Sticky header suppression</text>
      <text y="32">• Closed ShadowRoot HUD</text>
      <text y="48">• Real-time recording badge</text>
    </g>

    <!-- Status Dot -->
    <circle cx="184" cy="20" r="4" fill="#00F5FF" class="pulse-glow"/>
  </g>

  <!-- NODE 3: SERVICE WORKER CORE (Center Engine) -->
  <g transform="translate(410, 215)">
    <rect width="160" height="120" rx="16" fill="url(#cardGrad)" stroke="url(#purpleBorder)" stroke-width="1.8" filter="url(#softGlow)"/>
    <rect width="160" height="120" rx="16" fill="#0E0D1F" opacity="0.9"/>
    
    <!-- Header -->
    <circle cx="26" cy="24" r="12" fill="rgba(112, 0, 255, 0.25)"/>
    <circle cx="26" cy="24" r="5" fill="#7000FF"/>
    <text x="44" y="24" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="800">Service Worker</text>
    <text x="44" y="35" fill="#9B51E0" class="font-mono" font-size="9.5">service_worker.js</text>

    <!-- Details -->
    <g class="font-sans" font-size="10" fill="#C4B5FD" transform="translate(12, 54)">
      <text y="0">• MV3 Background Event Hub</text>
      <text y="14">• GPU Tile Stitcher (16K)</text>
      <text y="28">• Session Mutex &amp; Watchdog</text>
      <text y="42">• Keepalive Heartbeat Pulse</text>
      <text y="56">• Zero-Fetch Blob Pipeline</text>
    </g>

    <!-- Core Pulse Indicator -->
    <circle cx="144" cy="20" r="4" fill="#B800FF" class="pulse-glow"/>
  </g>

  <!-- NODE 4: OFFSCREEN MEDIA RECORDER (Top-Right) -->
  <g transform="translate(725, 95)" class="float-card">
    <rect width="200" height="120" rx="14" fill="url(#cardGrad)" stroke="url(#pinkBorder)" stroke-width="1.4" filter="url(#softGlow)"/>
    <rect width="200" height="120" rx="14" fill="#150A14" opacity="0.85"/>
    
    <!-- Header -->
    <rect x="12" y="12" width="24" height="24" rx="6" fill="rgba(255, 0, 122, 0.2)"/>
    <circle cx="24" cy="24" r="5" fill="#FF007A"/>
    <text x="44" y="24" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="800">Offscreen Recorder</text>
    <text x="44" y="35" fill="rgba(255, 255, 255, 0.45)" class="font-mono" font-size="9.5">offscreen.html / .js</text>

    <!-- Details -->
    <g class="font-sans" font-size="10.5" fill="#F472B6" transform="translate(14, 56)">
      <text y="0">• 4K / 60fps MediaRecorder</text>
      <text y="16">• AudioContext Dual Mixer</text>
      <text y="32">• DisplayMedia Direct Pipe</text>
      <text y="48">• VP9 / Opus WebM Chunker</text>
    </g>

    <!-- Status Dot -->
    <circle cx="184" cy="20" r="4" fill="#FF007A" class="pulse-glow"/>
  </g>

  <!-- NODE 5: STUDIO CANVAS & GALLERY (Bottom-Right) -->
  <g transform="translate(725, 335)">
    <rect width="200" height="120" rx="14" fill="url(#cardGrad)" stroke="url(#greenBorder)" stroke-width="1.4" filter="url(#softGlow)"/>
    <rect width="200" height="120" rx="14" fill="#081412" opacity="0.85"/>
    
    <!-- Header -->
    <rect x="12" y="12" width="24" height="24" rx="6" fill="rgba(0, 255, 178, 0.2)"/>
    <path d="M 18 28 L 28 18 M 25 18 L 29 22" stroke="#00FFB2" stroke-width="2" stroke-linecap="round"/>
    <text x="44" y="24" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="800">Studio Suite Pro</text>
    <text x="44" y="35" fill="rgba(255, 255, 255, 0.45)" class="font-mono" font-size="9.5">editor.html / editor.js</text>

    <!-- Details -->
    <g class="font-sans" font-size="10.5" fill="#6EE7B7" transform="translate(14, 56)">
      <text y="0">• 60fps HTML5 Canvas 2D</text>
      <text y="16">• Vector Arrow &amp; Text Tools</text>
      <text y="32">• Smart Privacy Redaction</text>
      <text y="48">• 20-Step Undo &amp; Gallery</text>
    </g>

    <!-- Status Dot -->
    <circle cx="184" cy="20" r="4" fill="#00FFB2" class="pulse-glow"/>
  </g>

  <!-- NODE 6: SANDBOXED INDEXEDDB STORAGE (Bottom-Center) -->
  <g transform="translate(410, 375)">
    <rect width="160" height="90" rx="14" fill="url(#cardGrad)" stroke="url(#purpleBorder)" stroke-width="1.4" filter="url(#softGlow)"/>
    <rect width="160" height="90" rx="14" fill="#0C0E1A" opacity="0.9"/>
    
    <!-- Header -->
    <rect x="12" y="12" width="22" height="22" rx="5" fill="rgba(112, 0, 255, 0.25)"/>
    <ellipse cx="23" cy="19" rx="6" ry="2.5" fill="none" stroke="#9B51E0" stroke-width="1.4"/>
    <path d="M 17 19 v 6 c 0 1.5 2.7 2.5 6 2.5 s 6 -1 6 -2.5 v -6" fill="none" stroke="#9B51E0" stroke-width="1.4"/>
    <text x="40" y="22" fill="#FFFFFF" class="font-sans" font-size="12" font-weight="800">SnapCapDB</text>
    <text x="40" y="32" fill="#A78BFA" class="font-mono" font-size="9">IndexedDB Local</text>

    <!-- Details -->
    <g class="font-sans" font-size="9.5" fill="#DDD6FE" transform="translate(12, 48)">
      <text y="0">• Sandboxed Browser Store</text>
      <text y="13">• Zero Cloud Leaks / Offline</text>
      <text y="26">• Direct Binary Blobs</text>
      <text y="39">• Real-Time Storage Purge</text>
    </g>

    <circle cx="144" cy="20" r="4" fill="#7000FF" class="pulse-glow"/>
  </g>

  <!-- Bottom Legend Footer -->
  <g transform="translate(35, 520)" class="font-sans">
    <rect x="0" y="0" width="890" height="24" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1"/>
    <circle cx="14" cy="12" r="3.5" fill="#00F5FF"/>
    <text x="24" y="15.5" fill="#A1A1AA" font-size="10.5" font-weight="600">Pure Vanilla JS</text>

    <circle cx="124" cy="12" r="3.5" fill="#7000FF"/>
    <text x="134" y="15.5" fill="#A1A1AA" font-size="10.5" font-weight="600">Zero NPM Runtime Deps</text>

    <circle cx="284" cy="12" r="3.5" fill="#FF007A"/>
    <text x="294" y="15.5" fill="#A1A1AA" font-size="10.5" font-weight="600">4K / 60fps Native WebM</text>

    <circle cx="444" cy="12" r="3.5" fill="#00FFB2"/>
    <text x="454" y="15.5" fill="#A1A1AA" font-size="10.5" font-weight="600">100% Offline-First Sandbox</text>

    <text x="735" y="15.5" fill="#71717A" font-size="10.5" font-weight="700">MIT COMMERCIAL LICENSE</text>
  </g>
</svg>
